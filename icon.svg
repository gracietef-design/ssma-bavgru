<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo com as cores corporativas da Vibra Energia -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00582C" />
      <stop offset="100%" stop-color="#008542" />
    </linearGradient>
  </defs>

  <!-- Fundo do ícone (quadrado arredondado padrão para Apps de Celular) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Escudo de Proteção de Fundo (Segurança/SSMA) -->
  <path d="M256,70 C310,70 390,95 405,115 C410,195 385,340 256,430 C127,340 102,195 107,115 C122,95 202,70 256,70 Z" 
        fill="none" 
        stroke="#FFC72C" 
        stroke-width="14" 
        stroke-linejoin="round" />

  <!-- LOGO VIBRA ENERGIA (Substituindo o antigo capacete) -->
  <g>
    <!-- Onda / Símbolo de Energia Vibra -->
    <path d="M 148 245 L 168 185 L 185 245 L 202 185 L 220 245" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="13" 
          stroke-linecap="butt" 
          stroke-linejoin="miter" 
          stroke-miterlimit="5" />
    
    <!-- Tipografia VIBRA -->
    <text x="236" y="242" 
          fill="#FFFFFF" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="54" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="2">VIBRA</text>
  </g>

  <!-- Texto SSMA na base do ícone -->
  <text x="256" y="365" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="62" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="4">SSMA</text>
        
  <!-- Tag BAVGRU secundária -->
  <text x="256" y="405" 
        fill="#FFC72C" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="30" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="2">BAVGRU</text>
</svg>
