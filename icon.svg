<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vibraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008542"/>
      <stop offset="100%" stop-color="#00582C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fundo Corporativo Arredondado -->
  <rect width="512" height="512" rx="110" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Símbolo Oficial Vibra Energia (Pulso / Vibração Corporativa) -->
  <g fill="none" stroke="#00582C" stroke-width="48" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="6">
    <!-- Haste Esquerda: Vertical descendo e diagonal subindo com ângulo característico -->
    <path d="M 172 165 L 172 360 L 292 90" />
    <!-- Haste Direita: Diagonal subindo e vertical descendo -->
    <path d="M 220 422 L 340 152 L 340 347" />
  </g>
</svg>