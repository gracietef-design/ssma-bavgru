  <!-- MODAL IMPORTAÇÃO DE COLABORADORES (EXCEL) -->
  <div id="modal-importar-colaboradores" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-3 z-50">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-5 md:p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3 pb-2 border-b">
        <div class="flex items-center gap-2">
          <span class="text-2xl">👥</span>
          <h3 class="font-bold text-slate-800 text-base">Importação em Lote de Colaboradores</h3>
        </div>
        <button onclick="fecharModalImportarColaboradores()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>
      <div class="space-y-4 text-xs">
        <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between bg-slate-50 p-2.5 rounded-lg border">
          <span class="font-bold text-slate-700">Modo de Gravação:</span>
          <div class="flex gap-4">
            <label class="flex items-center gap-1.5 cursor-pointer font-medium">
              <input type="radio" name="modo-importacao-colab" value="adicionar" checked />
              <span>Adicionar / Atualizar</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer font-medium text-red-700">
              <input type="radio" name="modo-importacao-colab" value="substituir" />
              <span>Substituir lista inteira</span>
            </label>
          </div>
        </div>
        <div>
          <label class="font-bold text-slate-700 uppercase text-[11px] block mb-1">Cole as linhas do Excel (Matrícula | Nome | Função | E-mail):</label>
          <textarea id="texto-importar-colab" rows="6" oninput="atualizarPreviaEmTempoReal()" placeholder="128660	ADAUTO RIBEIRO DOS SANTOS	OPERADOR DE ABASTECIMENTO SR	adautosantos@vibraenergia.com.br" class="w-full border rounded-xl p-3 font-mono text-xs bg-slate-50 border-slate-300"></textarea>
        </div>
        <div id="preview-importar-colab" class="hidden bg-slate-100 p-3 rounded-lg border text-slate-700">
          <p class="font-bold text-emerald-800" id="preview-colab-count">0 colaboradores reconhecidos</p>
          <div class="max-h-28 overflow-y-auto mt-1 divide-y divide-slate-200 text-[11px]" id="preview-colab-lista"></div>
        </div>
        <div class="flex justify-between items-center pt-2 border-t gap-2">
          <button type="button" onclick="fecharModalImportarColaboradores()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-xl font-bold">Cancelar</button>
          <button type="button" onclick="executarImportacaoColaboradores()" class="bg-vibraGreen hover:bg-vibraDark text-white px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm shadow">
            ✅ Importar e Salvar
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
