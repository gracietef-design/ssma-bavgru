<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo com as cores corporativas da Vibra Energia -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00582C" />
      <stop offset="100%" stop-color="#008542" />
    </linearGradient>
  </defs>

  <!-- Fundo do ícone (quadrado arredondado padrão para Apps de Celular) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Escudo de Proteção de Fundo (Segurança/SSMA) -->
  <path d="M256,70 C310,70 390,95 405,115 C410,195 385,340 256,430 C127,340 102,195 107,115 C122,95 202,70 256,70 Z" 
        fill="none" 
        stroke="#FFC72C" 
        stroke-width="14" 
        stroke-linejoin="round" />

  <!-- Símbolo do Capacete de Segurança do Trabalho (SMA) -->
  <!-- Casco Principal -->
  <path d="M160,250 C160,150 352,150 352,250 Z" fill="#FFC72C" />
  
  <!-- Aba do Capacete -->
  <path d="M130,245 L382,245 C395,245 395,260 382,260 L130,260 C117,260 117,245 130,245 Z" fill="#E0AF26" />
  
  <!-- Nervura de reforço do topo -->
  <path d="M241,155 L271,155 L271,230 L241,230 Z" fill="#FFF2CC" opacity="0.4" />
  <path d="M256,150 C240,150 240,180 240,245 L272,245 C272,180 272,150 256,150 Z" fill="#F0C020" />

  <!-- Texto SSMA na base do ícone -->
  <text x="256" y="365" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="62" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="4">SSMA</text>
        
  <!-- Tag BAVGRU secundária -->
  <text x="256" y="405" 
        fill="#FFC72C" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="30" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="2">BAVGRU</text>
</svg>
